[package]
name = "keep"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Vulkan: `loaded` = dlopen MoltenVK at runtime via ash::Entry::load_from($KEEP_VULKAN_LIB).
ash = { version = "0.38", features = ["loaded"] }
ash-window = "0.13"
winit = "0.30"
raw-window-handle = "0.6"
# Math on the hot path; bytemuck lets SceneParams be uploaded as raw bytes.
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
# Lua topcoat (scene.lua) + hot reload watcher.
mlua = { version = "0.10", features = ["lua54", "vendored"] }
notify = "6"
anyhow = "1"
# Audio: synthesis -> WAV (hound), analysis via FFT (realfft).
hound = "3"
realfft = "3"
# Decoding --audio input: WAV, FLAC, MP3, OGG/Vorbis, M4A/AAC (pure Rust).
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "adpcm"] }
rand = { version = "0.8", features = ["small_rng"] }
# Live playback + mic input.
cpal = "0.15"

[build-dependencies]
# GLSL -> SPIR-V at build time, pure Rust (no shaderc / glslang needed).
naga = { version = "25", features = ["glsl-in", "spv-out"] }

[profile.dev]
opt-level = 1
